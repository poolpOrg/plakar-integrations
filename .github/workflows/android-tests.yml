name: android tests

on:
  push:
    branches:
      - integration/android
    paths:
      - .github/workflows/android-tests.yml
      - 'android/**'
  pull_request:
    paths:
      - .github/workflows/android-tests.yml
      - 'android/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: android
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: android/go.mod

      - name: vet
        run: go vet ./...

      - name: build plugins
        run: go build ./...

      - name: tests
        run: go test -race -count=1 ./...

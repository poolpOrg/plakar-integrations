name: homeassistant tests

on:
  push:
    branches:
      - integration/homeassistant
    paths:
      - .github/workflows/homeassistant-tests.yml
      - 'homeassistant/**'
  pull_request:
    paths:
      - .github/workflows/homeassistant-tests.yml
      - 'homeassistant/**'
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: homeassistant
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: homeassistant/go.mod

      - name: vet
        run: go vet -v ./...

      - name: Running tests
        run: go test -race -v ./...

name: nextcloud tests

on:
  push:
    branches:
      - integration/nextcloud
    paths:
      - .github/workflows/nextcloud-tests.yml
      - 'nextcloud/**'
  pull_request:
    paths:
      - .github/workflows/nextcloud-tests.yml
      - 'nextcloud/**'
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nextcloud
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: nextcloud/go.mod

      - name: vet
        run: go vet -v ./...

      - name: Running tests
        run: go test -v ./...

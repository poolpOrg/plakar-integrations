name: n8n
display_name: n8n
description: Backup and restore of an n8n instance through its public REST API — workflows, tags, variables, projects, users and optionally executions.
homepage: https://github.com/poolpOrg/plakar-integrations/tree/main/n8n
license: ISC
api_version: v1.1.0
connectors:
- type: importer
  executable: n8n-importer
  validator: ./importer/schema.json
  protocols: [n8n]
  class: service
- type: exporter
  executable: n8n-exporter
  validator: ./exporter/schema.json
  protocols: [n8n]
  class: service
